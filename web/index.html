<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grapnl</title>
    <link rel="icon" href="data:,">
    <style>
        html,
        body,
        canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <!-- id="glcanvas" は macroquad の JS ローダーが必須としている名前。
         ローダーは window.onresize で clientWidth / clientHeight を読み、
         描画バッファをブラウザの表示サイズに合わせる。 -->
    <canvas id="glcanvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>
    <!-- wasm-bindgen ではなく macroquad 専用ローダー。
         出典: macroquad 0.4.16 の js/mq_js_bundle.js
         https://github.com/not-fl3/macroquad/blob/master/js/mq_js_bundle.js -->
    <!-- バンドル末尾の quad_net が strict mode で未宣言の register_plugin へ代入する。
         先にグローバルを置かないと、その代入が例外になりプラグイン登録が途中で止まる。 -->
    <script>var register_plugin;</script>
    <script src="mq_js_bundle.js"></script>
    <script>
        // 前の版は自己ベストを browser-game-1.high-score に持っていた。roommate-sdk の置き場所へ移す。
        // roommate-sdk はこれを読んで手元の自己ベストにするので、roommate-sdk.js より前に置く。
        try {
            var oldBest = Number(localStorage.getItem("browser-game-1.high-score"));
            var newBest = Number(localStorage.getItem("roommate.best.browser-game-1"));
            if (Number.isSafeInteger(oldBest) && oldBest > 0 && !(newBest >= oldBest)) {
                localStorage.setItem("roommate.best.browser-game-1", String(oldBest));
            }
            localStorage.removeItem("browser-game-1.high-score");
        } catch (e) {
            // localStorage が使えなくても遊べる。
        }
    </script>
    <!-- 匿名 ID・スコア・自己ベスト（roommate-sdk）。load() より前に読み込む。 -->
    <script src="roommate-sdk.js" data-game="browser-game-1"></script>
    <!-- 同時に遊んでいる人の影。load() より前に読み込む。 -->
    <script src="realtime.js"></script>
    <script>
        // 右クリックのブラウザメニューを出さない。
        // preventDefault は contextmenu だけを止め、mousedown / mouseup はローダーへ届く。
        document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });
        load("browser-game-1.wasm");
    </script>
</body>
</html>
