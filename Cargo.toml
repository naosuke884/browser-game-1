[package]
name = "browser-game-1"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser 2D action game (Rust + macroquad)"

[dependencies]
macroquad = "0.4"

# 公開用 WASM は初回ロードを軽くするため、release はサイズ優先にする。
# 開発中の `cargo run` は debug プロファイルなので、この設定の影響を受けない。
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# macroquad 推奨。依存クレートだけ最適化し、ゲーム側の再コンパイルは速いままにする。
[profile.dev.package."*"]
opt-level = 3
